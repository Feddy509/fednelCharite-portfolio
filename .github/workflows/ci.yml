# ==============================================================================
# FR: Pipeline CI/CD pour le contrôle de qualité et de sécurité (DevSecOps Gate)
# EN: CI/CD Pipeline for Quality and Security Control (DevSecOps Gate)
# ==============================================================================

name: CI Quality & Security Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # 1. SECRET SCANNING (Gitleaks)
  # FR: Détection des fuites de secrets et clés API dans l'historique Git
  # EN: Leak detection for secrets and API keys in Git history
  # ==========================================
  secret-scan:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==========================================
  # 2. STATIC APPLICATION SECURITY TESTING (SAST - CodeQL)
  # FR: Analyse statique de sécurité du code source JavaScript/TypeScript
  # EN: Static security analysis on JavaScript/TypeScript source code
  # ==========================================
  sast-scan:
    name: CodeQL Security Analysis (SAST)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: 'javascript-typescript'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ==========================================
  # 3. INFRASTRUCTURE AS CODE SCAN (Checkov IaC)
  # FR: Audit et scan de sécurité pour les fichiers de configuration Terraform
  # EN: Security audit and scan for Terraform configuration files
  # ==========================================
  iac-scan:
    name: Infrastructure as Code Scan (Checkov)
    runs-on: ubuntu-latest
    needs: [secret-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov IaC Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          framework: 'terraform'
          output_format: 'cli'
          soft_fail: true

  # ==========================================
  # 4. CODE QUALITY & DEPENDENCY SCAN (SCA)
  # FR: Tests de qualité du code, audit des dépendances et génération du SBOM
  # EN: Code quality testing, dependency audit, and SBOM generation
  # ==========================================
  quality-gate:
    name: Code Quality & Security Check
    runs-on: ubuntu-latest
    needs: [iac-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.1.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-workspace

      - name: Run Linter
        run: pnpm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Security Audit
        run: pnpm audit --audit-level=high || true

      - name: Dependency Vulnerability Scan (Trivy SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Generate SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          path: '.'
          format: 'spdx-json'
          output-file: 'sbom.spdx.json'

      - name: Test Build
        run: pnpm run build

  # ==========================================
  # 5. CONTAINER SECURITY SCAN & OIDC KEYLESS SIGNING (Cosign)
  # FR: Analyse d'image Docker et préparation pour la signature OIDC sans clé
  # EN: Docker image scan and preparation for keyless OIDC signing
  # ==========================================
  container-security:
    name: Docker Image Vulnerability Scan & Cosign Signing
    runs-on: ubuntu-latest
    needs: [quality-gate]
    permissions:
      contents: read
      packages: write
      id-token: write # FR: Permissions OIDC pour Cosign sans clé / EN: OIDC permission for keyless Cosign

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image
        run: |
          docker build -t fednel-portfolio:test .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fednel-portfolio:test'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      - name: Verify Cosign Installation & OIDC Token Setup
        run: |
          cosign version
          echo "Cosign OIDC Environment Ready for Keyless Signing."