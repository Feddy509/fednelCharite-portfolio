name: CI/CD Pipeline

# Déclencheurs / Triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check (Vérification du code)
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source / Checkout source code
      - name: Checkout repository / Récupérer le code
        uses: actions/checkout@v4

      # 2. Installation de pnpm / Install pnpm
      - name: Install pnpm / Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. Configuration de Node.js / Setup Node.js environment
      - name: Setup Node.js / Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Installation des dépendances avec pnpm / Install dependencies
      - name: Install dependencies / Installer les dépendances
        run: pnpm install --frozen-lockfile

      # 5. Vérification de la qualité du code (ESLint) / Run ESLint check
      - name: Run Linter / Exécuter le linter
        run: pnpm run lint

      # 6. Vérification des types TypeScript / Run TypeScript check
      - name: Type check / Vérifier les types TypeScript
        run: npx tsc --noEmit

  docker-build:
    name: Docker Build Test (Test de construction Docker)
    runs-on: ubuntu-latest
    needs: lint-and-typecheck # S'exécute après la première étape / Runs after lint step

    steps:
      # 1. Récupération du code source / Checkout source code
      - name: Checkout repository / Récupérer le code
        uses: actions/checkout@v4

      # 2. Configuration de Docker Buildx / Set up Docker Buildx
      - name: Set up Docker Buildx / Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Test de construction de l'image Docker / Test Docker image build
      - name: Build Docker image / Tester la construction de l'image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false # Ne publie pas l'image, vérifie seulement si le build fonctionne / Only test build