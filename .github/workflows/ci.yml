name: CI Quality & Security Gate

# Déclencheurs / Triggers
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Code Quality & Security Check
    runs-on: ubuntu-latest

    steps:
      # 1. Récupération du code source / Checkout source code
      - name: Checkout repository / Récupérer le code
        uses: actions/checkout@v4

      # 2. Configuration de Node.js / Setup Node.js environment
      - name: Setup Node.js / Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Installation de pnpm / Install pnpm
      - name: Install pnpm / Installer pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 4. Installation des dépendances avec pnpm / Install dependencies
      - name: Install dependencies / Installer les dépendances
        run: pnpm install --no-frozen-lockfile

      # 5. Vérification de la qualité du code (ESLint) / Run ESLint check
      - name: Run Linter / Exécuter le linter
        run: pnpm run lint

      # 6. Vérification des types TypeScript / Run TypeScript check
      - name: Type check / Vérifier les types TypeScript
        run: npx tsc --noEmit

      # 7. Audit de sécurité des dépendances / Security Audit
      - name: Security Audit / Audit de sécurité
        run: pnpm audit --audit-level=high || true

      # 8. Test de Build Next.js / Test Next.js Build
      - name: Test Build / Tester la compilation Next.js
        run: pnpm run build