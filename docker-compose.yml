# ==============================================================================
# FR: Fichier d'Orchestration Docker Compose (Production)
# EN: Docker Compose Orchestration File (Production)
# ==============================================================================

version: '3.8'

services:
  # FR: Service principal de l'application Portfolio Next.js
  # EN: Primary Next.js Portfolio application service
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: always

  # FR: Reverse Proxy et WAF avec Nginx pour la sécurité et le Rate Limiting
  # EN: Nginx Reverse Proxy and WAF for security and Rate Limiting
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - portfolio
    restart: always